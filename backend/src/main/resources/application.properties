spring.application.name=mi-bienestar
# Lee el archivo .env tanto si se arranca desde la raiz como desde backend/
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Todo el equipo comparte Supabase y su pooler admite 15 conexiones en total: cada copia de la
# aplicacion usa pocas y las suelta cuando no las necesita.
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never

server.port=8080
server.forward-headers-strategy=native

app.security.secretkey=${APP_SECURITY_SECRETKEY}
app.security.expirationMinutes=${APP_SECURITY_EXPIRATIONMINUTES:60}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:*}
